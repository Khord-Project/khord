name: CI

# Runs on every push to main and on every PR targeting main. Three
# parallel jobs: shared/jvm tests, server pytest, Android APK build.
# build-android only runs after test-shared passes (gating signal: if
# the shared module's tests fail, the APK is unbuildable anyway and
# we'd rather see the failure clearly than have two red jobs).

on:
  push:
    branches: [main]
    # Skip the full build pipeline when a push touches ONLY docs /
    # text-only assets. `paths-ignore` is whole-set: if ANY changed
    # file is outside this list, all jobs run normally. The release
    # workflow (.github/workflows/release.yml) is unaffected — it
    # triggers on tag pushes, not branch pushes, and rebuilds
    # unconditionally by design.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'DCO'
      - 'assets/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - 'DCO'
      - 'assets/**'

# Concurrency: cancel any in-flight run for the same ref when a new
# push lands. Saves CI minutes on rapid-fire pushes; release tag
# pushes go through release.yml and are unaffected.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-shared:
    name: Shared module — jvmTest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v3

      - name: Run shared:jvmTest
        working-directory: client
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: shared-jvmTest-reports
          path: client/shared/build/reports/tests/jvmTest

  test-servers:
    name: Server tests (keyserver + relayserver)
    runs-on: ubuntu-latest

    services:
      keyserver-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: khord_ks
          POSTGRES_PASSWORD: test
          POSTGRES_DB: khord_keyserver
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

      relayserver-db:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: khord_rs
          POSTGRES_PASSWORD: test
          POSTGRES_DB: khord_relayserver
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            servers/keyserver/requirements.txt
            servers/relayserver/requirements.txt

      # ── Key Server ────────────────────────────────────────────────────
      # Keyserver conftest calls Base.metadata.create_all so the empty
      # Postgres database just needs to exist — no alembic step needed.

      - name: Install keyserver dependencies
        working-directory: servers/keyserver
        run: pip install -r requirements.txt

      - name: Run keyserver tests
        working-directory: servers/keyserver
        env:
          DATABASE_URL: postgresql+asyncpg://khord_ks:test@localhost:5433/khord_keyserver
          KEY_SERVER_TOKEN_SECRET: test-secret-do-not-use-in-production
        run: pytest tests -q

      # ── Relay Server ──────────────────────────────────────────────────
      # Relayserver conftest does NOT create schema, so we run alembic
      # migrations first to set up the tables.

      - name: Install relayserver dependencies
        working-directory: servers/relayserver
        run: pip install -r requirements.txt

      - name: Apply relayserver schema (alembic upgrade head)
        working-directory: servers/relayserver
        env:
          DATABASE_URL: postgresql+asyncpg://khord_rs:test@localhost:5434/khord_relayserver
        run: alembic upgrade head

      - name: Run relayserver tests
        working-directory: servers/relayserver
        env:
          DATABASE_URL: postgresql+asyncpg://khord_rs:test@localhost:5434/khord_relayserver
        run: pytest tests -q

  build-android:
    name: Build Android prod APK
    runs-on: ubuntu-latest
    needs: test-shared
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        # Pre-installs the Android command-line tools + platform-tools
        # so the first Gradle invocation doesn't have to download them.
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v3

      # ── Optional release-signing setup ────────────────────────────────
      # When secrets.KEYSTORE_BASE64 is present (push to main on the
      # canonical repo), CI builds the SIGNED prod release APK so the
      # artifact is install-ready. When it's empty (PRs from forks, or
      # an org without the secret yet), the step is skipped and we fall
      # back to the prod DEBUG APK. The debug APK is signed with the
      # Android debug keystore — usable for testing but not shippable.

      - name: Decode release keystore (if secret present)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > client/khord-release.jks
          echo "have_keystore=true" >> "$GITHUB_OUTPUT"

      - name: Write release-keystore.properties (if secret present)
        if: steps.keystore.outputs.have_keystore == 'true'
        env:
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD_ENV: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS_ENV: ${{ secrets.KEY_ALIAS }}
        run: |
          cat > client/release-keystore.properties <<EOF
          storeFile=../khord-release.jks
          storePassword=${STORE_PASSWORD}
          keyAlias=${KEY_ALIAS_ENV}
          keyPassword=${KEY_PASSWORD_ENV}
          EOF

      - name: Build prod release APK (signed)
        if: steps.keystore.outputs.have_keystore == 'true'
        working-directory: client
        run: ./gradlew :android:assembleProdRelease --no-daemon

      - name: Build prod debug APK (fallback when no keystore)
        if: steps.keystore.outputs.have_keystore != 'true'
        working-directory: client
        run: ./gradlew :android:assembleProdDebug --no-daemon

      - name: Locate the produced APK
        id: apk
        # APK outputs are renamed to khord-<versionName>.apk by the
        # androidComponents onVariants hook in android/build.gradle.kts, so
        # glob rather than hard-code the version into the filename.
        run: |
          release_apk=$(ls client/android/build/outputs/apk/prod/release/khord-*.apk 2>/dev/null | head -n1)
          if [ -n "$release_apk" ]; then
            echo "path=$release_apk" >> "$GITHUB_OUTPUT"
            echo "kind=release" >> "$GITHUB_OUTPUT"
          else
            debug_apk=$(ls client/android/build/outputs/apk/prod/debug/khord-*.apk 2>/dev/null | head -n1)
            echo "path=$debug_apk" >> "$GITHUB_OUTPUT"
            echo "kind=debug" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK as workflow artifact
        # Artifact name encodes both the SHA and whether the APK is
        # release-signed vs debug-fallback so downloaders can tell at
        # a glance whether it's install-ready.
        uses: actions/upload-artifact@v4
        with:
          name: android-prod-${{ steps.apk.outputs.kind }}-${{ github.sha }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
