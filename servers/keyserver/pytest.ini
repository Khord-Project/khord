[pytest]
asyncio_mode = auto
# Share one event loop across the whole session so that the session-scoped
# asyncpg engine (and its connection pool) is bound to the loop that owns it.
# Both fixtures AND tests must run on the same loop, otherwise asyncpg
# connections opened in one loop cannot close in another.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
addopts = -ra -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
